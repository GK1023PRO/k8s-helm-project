name: Kubernetes CD Pipeline

on:
  workflow_run:
    workflows: ["Kubernetes CI Pipeline"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image
        run: |
          echo "IMAGE=ghcr.io/${{ github.repository_owner }}/node-app:${{ github.sha }}" >> $GITHUB_ENV

      - name: Deploy with Helm
        run: |
          helm upgrade --install node-app ./node-app-chart \
            --set image.repository=ghcr.io/${{ github.repository_owner }}/node-app \
            --set image.tag=${{ github.sha }}